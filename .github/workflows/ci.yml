name: Verify Hearts in Bloom

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: hib_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Type-check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Build full-stack site
        run: npm run build
      - name: Production start-up smoke test (no Kimi-specific variables)
        run: |
          # Start the built server with a deliberately minimal environment:
          # no APP_ID, APP_SECRET, KIMI_* or MailerLite variables. The database
          # URL points at nothing; connections are lazy, so the server and the
          # static site must still come up.
          env -i PATH="$PATH" HOME="$HOME" NODE_ENV=production PORT=3100 \
            DATABASE_URL="mysql://user:pass@127.0.0.1:3306/smoke" \
            node dist/boot.js > server.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:3100/; then break; fi
            sleep 1
          done
          fail=0
          for path in / /about /enquire /no-such-page; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: text/html' "http://127.0.0.1:3100$path")
            echo "GET $path -> $code"
            [ "$code" = "200" ] || fail=1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/not-a-route)
          echo "GET /api/not-a-route -> $code"
          [ "$code" = "404" ] || fail=1
          kill $SERVER_PID || true
          cat server.log
          exit $fail
      - name: Database migration, TLS and enquiry persistence test (MySQL 8)
        run: |
          set -e
          ROOT="mysql://root:ci-only-password@127.0.0.1:3306/hib_ci"
          PLAIN="mysql://hib_tls:ci-tls-password@127.0.0.1:3306/hib_ci"
          TLS="$PLAIN?ssl-mode=REQUIRED"

          # A database user that refuses unencrypted connections, like a managed host.
          DATABASE_URL="$ROOT" node -e '
            const mysql = require("mysql2/promise");
            (async () => {
              const c = await mysql.createConnection({ uri: process.env.DATABASE_URL });
              await c.query("CREATE USER \"hib_tls\"@\"%\" IDENTIFIED BY \"ci-tls-password\" REQUIRE SSL");
              await c.query("GRANT ALL ON hib_ci.* TO \"hib_tls\"@\"%\"");
              await c.end();
            })().catch((e) => { console.error(e.message); process.exit(1); });
          '

          echo "Without ssl-mode the TLS-only user must be refused:"
          if DATABASE_URL="$PLAIN" node dist/migrate.js; then
            echo "Unexpected success without TLS"; exit 1
          fi

          echo "With ssl-mode=REQUIRED the migration must apply, and re-running must be harmless:"
          DATABASE_URL="$TLS" node dist/migrate.js
          DATABASE_URL="$TLS" node dist/migrate.js

          echo "Start the production server (minimal environment, TLS-only database user):"
          env -i PATH="$PATH" HOME="$HOME" NODE_ENV=production PORT=3200 DATABASE_URL="$TLS" \
            node dist/boot.js > server-db.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:3200/; then break; fi
            sleep 1
          done

          EVENT_DATE=$(date -u -d '+60 days' +%F)
          STARTED=$(( $(date +%s%3N) - 5000 ))
          BODY="{\"json\":{\"name\":\"CI Test\",\"email\":\"ci-test@example.com\",\"phone\":\"\",\"eventDate\":\"$EVENT_DATE\",\"venue\":\"CI venue\",\"service\":\"Throne chairs\",\"packageName\":\"\",\"style\":\"\",\"coverage\":\"\",\"message\":\"Automated persistence test\",\"consent\":true,\"website\":\"\",\"startedAt\":$STARTED}}"
          RESPONSE=$(curl -s -X POST http://127.0.0.1:3200/api/trpc/enquiry.submit -H 'content-type: application/json' -d "$BODY")
          kill $SERVER_PID || true
          echo "$RESPONSE"
          REF=$(echo "$RESPONSE" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).result.data.json.reference))')
          echo "Reference returned: $REF"

          echo "The enquiry must now be stored in MySQL:"
          DATABASE_URL="$ROOT" REF="$REF" node -e '
            const mysql = require("mysql2/promise");
            (async () => {
              const c = await mysql.createConnection({ uri: process.env.DATABASE_URL });
              const [rows] = await c.query("SELECT reference, status, email FROM enquiries WHERE reference = ?", [process.env.REF]);
              await c.end();
              console.log(JSON.stringify(rows));
              if (rows.length !== 1 || rows[0].status !== "new") process.exit(1);
            })().catch((e) => { console.error(e.message); process.exit(1); });
          '
